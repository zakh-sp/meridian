<button id="btn-primary-root" style="display: inline-flex; align-items: center; gap: $spacing.sm; background: $color.primary; color: $color.text; font-size: $type.base; font-weight: $type.weight-semibold; padding: 12px $spacing.xl; border-radius: $radius.full; border: none; cursor: pointer; letter-spacing: -0.01em; white-space: nowrap;">
  <span data-slot="label">Get started free</span>
</button>
<template data-variant="large">
  <button id="btn-primary-lg" style="display: inline-flex; align-items: center; gap: $spacing.sm; background: $color.primary; color: $color.text; font-size: $type.lg; font-weight: $type.weight-semibold; padding: 14px 48px; border-radius: $radius.full; border: none; cursor: pointer; letter-spacing: -0.01em; white-space: nowrap; box-shadow: $shadow.glow-primary;">
    <span data-slot="label">Get started free</span>
  </button>
</template>
