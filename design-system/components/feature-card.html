<div id="feature-card-root" style="background: $color.surface; border: 1px solid $color.border; border-radius: $radius.lg; padding: $spacing.xl; display: flex; flex-direction: column; gap: $spacing.md;">
  <div id="feature-icon-wrap" style="width: 48px; height: 48px; border-radius: $radius.md; background: $color.primary-glow; border: 1px solid rgba(59,130,246,0.2); display: flex; align-items: center; justify-content: center; font-size: 22px;">
    <span data-slot="icon">✈️</span>
  </div>
  <div id="feature-text" style="display: flex; flex-direction: column; gap: $spacing.sm;">
    <div id="feature-title" style="font-size: $type.xl; font-weight: $type.weight-semibold; color: $color.text; line-height: 1.3;">
      <span data-slot="title">Feature title</span>
    </div>
    <div id="feature-desc" style="font-size: $type.sm; color: $color.text-muted; line-height: 1.6;">
      <span data-slot="description">Feature description goes here.</span>
    </div>
  </div>
</div>
